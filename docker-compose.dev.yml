# Set TZ=Asia/Jerusalem in your shell before running the API locally:
#   export TZ=Asia/Jerusalem && pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-postgres
    environment:
      POSTGRES_DB: voice_db
      POSTGRES_USER: voice_user
      POSTGRES_PASSWORD: voice_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_user -d voice_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voice-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
