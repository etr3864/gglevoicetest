apiVersion: v1
kind: Service
metadata:
  name: voice-api
  labels:
    app: voice-api
  annotations:
    cloud.google.com/backend-config: '{"default": "voice-api-backend"}'
spec:
  type: NodePort
  selector:
    app: voice-api
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: voice-api-backend
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 300
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-api-ingress
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: voice-api-ip
    networking.gke.io/managed-certificates: voice-api-cert
spec:
  defaultBackend:
    service:
      name: voice-api
      port:
        number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: voice-api-cert
spec:
  domains:
    - voiceapi.0ptive.com
