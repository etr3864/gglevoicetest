apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-api
  labels:
    app: voice-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: voice-api
    spec:
      initContainers:
        - name: migrate
          image: me-west1-docker.pkg.dev/gen-lang-client-0546829339/voice-ai/voice-api:latest
          command: ["sh", "-c", "cd /app && HOME=/tmp pnpm dlx prisma@6 migrate resolve --applied '20260301000000_init' --schema=packages/db/prisma/schema.prisma 2>/dev/null || true && HOME=/tmp pnpm dlx prisma@6 migrate deploy --schema=packages/db/prisma/schema.prisma"]
          envFrom:
            - secretRef:
                name: voice-api-secrets
          volumeMounts:
            - name: google-cloud-key
              mountPath: /var/secrets/google
              readOnly: true
      containers:
        - name: voice-api
          image: me-west1-docker.pkg.dev/gen-lang-client-0546829339/voice-ai/voice-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: voice-api-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: API_URL
              value: "https://voiceapi.0ptive.com"
            - name: FRONTEND_URL
              value: "https://voiceapp.0ptive.com"
            - name: TELNYX_APP_ID
              value: "2899429708024252053"
            - name: GCP_PROJECT_ID
              value: "gen-lang-client-0546829339"
            - name: GCP_LOCATION
              value: "us-central1"
            - name: AUDIO_POOL_SIZE
              value: "8"
            - name: GCS_RECORDING_BUCKET
              value: "voice-ai-recordings-gen-lang-0546829339"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/credentials.json"
          volumeMounts:
            - name: google-cloud-key
              mountPath: /var/secrets/google
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            failureThreshold: 10
            periodSeconds: 3
      terminationGracePeriodSeconds: 1800
      volumes:
        - name: google-cloud-key
          secret:
            secretName: gcp-auth-secret
