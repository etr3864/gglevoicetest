name: Build & Deploy to GKE (Staging)

on:
  push:
    branches: [staging]

env:
  PROJECT_ID: gen-lang-client-0546829339
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/gen-lang-client-0546829339/voice-ai-us
  IMAGE: voice-api
  GKE_CLUSTER: voice-ai-cluster-us
  NAMESPACE: staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE }}:staging-${{ github.sha }}
          docker build -t $IMAGE_TAG -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging -f Dockerfile .
          docker push $IMAGE_TAG
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Apply k8s manifests
        run: kubectl apply -f k8s/staging/

      - name: Deploy to GKE staging
        run: |
          kubectl set image deployment/voice-api-staging \
            voice-api=${{ env.REGISTRY }}/${{ env.IMAGE }}:staging-${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/voice-api-staging \
            -n ${{ env.NAMESPACE }} --timeout=20m
